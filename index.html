<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strong Hips">
<title>Mobile Strong Hips</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181D'/%3E%3Crect x='5' y='13' width='7' height='6' fill='%23F2C230'/%3E%3Crect x='13' y='13' width='7' height='6' fill='%23D8433A'/%3E%3Crect x='21' y='13' width='6' height='6' fill='%232C9A58'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column. The stretched resistance band, yellow to red to green, is the page's one loud element. */
:root{
  --ground:#EDF0F2; --surface:#FBFCFC; --sunken:#E2E7EA; --ink:#14181D; --muted:#515C66; --line:#D3D9DE;
  --action:#14181D; --action-ink:#FBFCFC; --focus:#2A78D6;
  --band-yellow:#F2C230; --band-red:#D8433A; --band-green:#2C9A58; --band-review:#3A4652;
  --climb:#2a78d6; --skate:#eb6834; --mobility:#1baf7a; --physio:#eda100; --rest:#e87ba4;
  --seq-part:#C4DAF3; --seq-full:#2a78d6; --seq-part-ink:#14181D; --seq-full-ink:#ffffff;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --grid:#E1E5E8; --tip:#14181D; --tip-ink:#FBFCFC;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#101418; --surface:#191E24; --sunken:#232A31; --ink:#ECEFF2; --muted:#A3ADB7; --line:#2E363E;
    --action:#ECEFF2; --action-ink:#101418; --focus:#5A9BEA;
    --band-review:#8996A3;
    --climb:#3987e5; --skate:#d95926; --mobility:#199e70; --physio:#c98500; --rest:#d55181;
    --seq-part:#1F3A5C; --seq-full:#3987e5; --seq-part-ink:#ECEFF2; --seq-full-ink:#ffffff;
    --grid:#262D34; --tip:#ECEFF2; --tip-ink:#101418;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.wrap{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.35rem}
h3{font-size:1rem;font-weight:700}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand b{font:800 1.05rem/1.1 var(--display)}
.status{display:none;font:500 .75rem/1 var(--mono);white-space:nowrap}
.status.bad{display:inline;color:var(--critical)}
.tabs{display:flex;gap:2px;padding-bottom:8px}
.tab{flex:1 1 auto;padding:8px 6px;border-radius:6px;color:var(--muted);font-weight:700;font-size:.9375rem;white-space:nowrap;min-height:40px;text-align:center}
.tab[aria-current="page"]{background:var(--action);color:var(--action-ink)}
main{padding-block:18px 56px;display:grid;gap:26px}
main>*{min-width:0}
section{display:grid;gap:12px;min-width:0}
.note{padding:10px 12px;border-radius:6px;background:var(--sunken);font-size:.9375rem}
.note.bad{background:var(--critical);color:#fff}
.note .btn.quiet{background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:6px;background:var(--action);color:var(--action-ink);font-weight:700}
.btn.quiet{background:var(--sunken);color:var(--ink)}
.btn.danger{background:none;color:var(--critical);box-shadow:inset 0 0 0 1px var(--critical)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* Week hero and the band */
.hero{display:grid;gap:10px}
.eyebrow{font:500 .75rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
main h1{font-size:2.4rem}
.arrows{display:flex;gap:4px}
.arrow{width:44px;height:44px;border-radius:6px;background:var(--sunken);font-weight:700}
.arrow[disabled]{opacity:.35;cursor:default}
.phase-tag{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.swatch{width:26px;height:10px;border-radius:2px;background:var(--pc,var(--muted));flex:none}
[data-phase="p1"]{--pc:var(--band-yellow)} [data-phase="p2"]{--pc:var(--band-red)} [data-phase="p3"]{--pc:var(--band-green)} [data-phase="review"]{--pc:var(--band-review)}
.band{display:flex;gap:2px;align-items:flex-end}
.seg{flex:1 1 0;min-width:0;display:grid;gap:4px;justify-items:stretch;font:500 .6875rem/1 var(--mono);color:var(--muted);text-align:center}
.seg i{display:block;height:24px;background:var(--pc);opacity:.32;border-radius:2px}
.seg.easy i{height:10px}
.seg.past i,.seg.now i{opacity:1}
.seg.view{color:var(--ink);font-weight:500}
.seg.view i{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--ink)}
.band-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8125rem;color:var(--muted)}
.band-key span{display:inline-flex;align-items:center;gap:6px}

/* Weekly targets */
.targets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.target{background:var(--surface);border-radius:8px;padding:8px 2px;display:grid;gap:1px;text-align:center}
.target .lab{font-size:.6875rem;color:var(--muted);display:inline-flex;gap:3px;align-items:center;justify-content:center}
.target .lab .dot{width:6px;height:6px}
.target .val{font:500 1rem/1.2 var(--mono)}
.target.met .val::after{content:" ✓";font-size:.75rem}
[data-cat="climb"]{--c:var(--climb)} [data-cat="skate"]{--c:var(--skate)} [data-cat="mobility"]{--c:var(--mobility)} [data-cat="physio"]{--c:var(--physio)} [data-cat="rest"]{--c:var(--rest)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none;display:inline-block}

/* Day strip and session cards */
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dcell{display:grid;justify-items:center;align-content:start;gap:2px;padding:7px 0;border-radius:6px;background:var(--surface);min-height:64px}
.dcell .wd{font:500 .6875rem/1.2 var(--mono);color:var(--muted)}
.dcell .dn{font-weight:700;font-size:1.0625rem;line-height:1.2}
.dcell .ds{display:flex;gap:2px;height:12px;align-items:center;font-size:.75rem;font-weight:700}
.dcell .ds i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.dcell.istoday{box-shadow:inset 0 0 0 2px var(--ink)}
.dcell[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
.dcell[aria-pressed="true"] .wd{color:var(--action-ink)}
.card{background:var(--surface);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.card-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.card-h .dot{width:14px;height:14px}
.badge{font-size:.8125rem;font-weight:700;white-space:nowrap}
.card .btn{width:100%}
.card-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.seg2{display:inline-flex;gap:2px;padding:2px;border-radius:7px;background:var(--sunken);justify-self:start}
.seg2 button{min-height:36px;padding:6px 12px;border-radius:5px;font-size:.875rem;font-weight:700;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
.tool{min-height:40px;padding:6px 10px;font-size:.875rem;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.exlist{list-style:none;padding:0;display:grid}
.exlist li{display:grid;gap:1px;padding:7px 0;border-top:1px solid var(--grid)}
.exlist .rx{color:var(--muted);font-size:.8125rem}
.lede{font-weight:700;font-size:1.125rem}
.linkbtn{min-height:44px;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-align:left}
.steps{padding-left:1.25em;display:grid;gap:5px;max-width:65ch}
.savebar{position:sticky;bottom:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ground);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.f-lab{font-size:.8125rem;color:var(--muted)}

.sessions{display:grid;gap:8px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.dayhead h1{font-size:2rem}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:72px;padding:12px 14px;border-radius:10px;background:var(--surface);text-align:left}
.srow.plain{grid-template-columns:minmax(0,1fr) auto}
.srow .dot{width:14px;height:14px}
.srow-t{min-width:0}
.srow-t b{display:block;font-size:1.0625rem;line-height:1.25}
.srow-t span{font-size:.875rem;color:var(--muted)}
.srow-a{padding:9px 16px;border-radius:7px;background:var(--action);color:var(--action-ink);font-weight:700;font-size:.9375rem;white-space:nowrap}
.srow-a.quiet{background:var(--sunken);color:var(--ink)}
.srow.done .srow-a{padding-inline:2px;background:none;color:var(--ink)}
.edtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.edhead{gap:10px}
.titled{display:flex;align-items:center;gap:10px}
.titled .dot{width:14px;height:14px}
.titled h1{font-size:1.875rem}
.linkbtn.danger{color:var(--critical)}

/* Week at a glance */
.days{display:grid;gap:2px}
.day{display:grid;grid-template-columns:64px minmax(0,1fr) 20px;gap:8px;align-items:center;width:100%;background:var(--surface);padding:8px 10px;min-height:56px;text-align:left}
.day:first-child{border-radius:8px 8px 0 0}.day:last-child{border-radius:0 0 8px 8px}
.day.today{background:var(--sunken)}
.day-d b{display:block;font-weight:700;line-height:1.2}
.day-d span{font:400 .75rem/1.2 var(--mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);font-size:.9375rem;min-height:36px;text-align:left}
.chip.done{background:var(--action);color:var(--action-ink);box-shadow:none}
.chip.moved{color:var(--muted)}

/* Session editor */
.exs{display:grid;gap:6px}
.ex{background:var(--surface);border-radius:10px;min-width:0;scroll-margin-top:10px}
.ex.skipped{opacity:.65}
.exh{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;min-height:60px;padding:2px 4px 2px 2px}
.tick{display:grid;place-items:center;width:48px;height:52px}
.exm{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted);font-size:.875rem;font-weight:700}
.exo{display:grid;grid-template-columns:minmax(0,1fr) 22px;gap:8px;align-items:center;width:100%;min-height:52px;padding:6px 8px 6px 0;text-align:left}
.ex.done .exm{background:var(--good);box-shadow:none;color:#fff}
.exn{min-width:0}
.exn b{display:block;line-height:1.25}
.exn .rx{display:block;color:var(--muted);font-size:.8125rem;font-weight:400}
.chev{color:var(--muted);font-size:1.25rem;line-height:1;text-align:center}
.exb{display:grid;gap:10px;padding:0 12px 14px}
.how{font-size:.875rem;color:var(--muted)}
details.how summary{cursor:pointer;min-height:28px}
details.how p{color:var(--ink);margin-top:2px}
.rx{font:500 .875rem/1.35 var(--mono)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label.f{display:grid;gap:3px;font-size:.75rem;color:var(--muted);min-width:0}
input.t,textarea.t,select.t{width:100%;min-height:44px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--ground);font-size:1rem;color:var(--ink)}
textarea.t{min-height:84px;resize:vertical}
.last{padding:6px 9px;border-radius:6px;background:var(--sunken);font-size:.875rem}
.sets{display:grid;gap:4px;justify-items:start}
.setrow,.sethead{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 34px;gap:6px;align-items:center;width:100%}
.sethead{font-size:.75rem;color:var(--muted)}
.sethead span:first-child,.sn{text-align:center}
.sn{font:500 .875rem/1 var(--mono);color:var(--muted)}
.setdel{height:44px;font-size:1.25rem;line-height:1;color:var(--muted)}
.cheer-line{font-weight:700}
.opt{margin-left:4px;padding:1px 6px;border-radius:4px;background:var(--sunken);font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap}
.feel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px}
.feel button{min-height:44px;border-radius:6px;background:var(--sunken);font-weight:700;padding:6px 10px}
.feel button[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
.scale{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}
.scale button{height:42px;border-radius:5px;background:var(--sunken);font:500 .875rem/1 var(--mono)}
.grp{display:grid;gap:4px}
.scale button[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
.flag{display:flex;align-items:flex-start;gap:8px;font-size:.9375rem}
.flag::before{content:"";width:10px;height:10px;border-radius:2px;margin-top:.4em;background:var(--fc);flex:none}
.flag[data-level="good"]{--fc:var(--good)} .flag[data-level="warning"]{--fc:var(--warning)} .flag[data-level="critical"]{--fc:var(--critical)}

/* Exercises */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filter{padding:6px 12px;border-radius:6px;background:var(--sunken);white-space:nowrap;min-height:36px;font-size:.9375rem}
.filter[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
.list{display:grid;gap:2px}
.item{background:var(--surface);min-width:0}
.item:first-child{border-radius:8px 8px 0 0}.item:last-child{border-radius:0 0 8px 8px}
.item-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 12px;text-align:left;min-height:60px}
.item-h b{display:block;line-height:1.25}
.item-h .rx{display:block}
.lastline{display:block;font-size:.8125rem;color:var(--muted);margin-top:2px}
.item-b{padding:0 12px 14px;display:grid;gap:12px;min-width:0}
.spark{display:block;width:92px;height:30px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th{font-weight:400;color:var(--muted);text-align:left;padding:4px 10px 4px 0;white-space:nowrap}
td{padding:6px 10px 6px 0;border-top:1px solid var(--grid);vertical-align:top}
td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Progress */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fields.one{grid-template-columns:minmax(0,1fr)}
.chk{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--grid)}
.tight{padding-left:1.1em;display:grid;gap:3px}
select.t{appearance:auto}
.why{font-size:.9375rem}
.why summary{cursor:pointer;font-weight:700;min-height:32px}
.why ul{padding-left:1.1em;display:grid;gap:6px;margin:6px 0 0;max-width:65ch}
.tile{background:var(--surface);border-radius:6px;padding:10px;display:grid;gap:2px}
.tile .lab{font-size:.8125rem;color:var(--muted)}
.tile .val{font:600 1.5rem/1.1 var(--display)}
table.heat{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:2px;font-size:.8125rem}
.heat th{padding:0;font-size:.8125rem}
.heat th:first-child{width:62px}
.heat thead th{padding:0 0 2px;text-align:center;font:400 .6875rem/1 var(--mono)}
.heat thead th.now{color:var(--ink);font-weight:500}
.heat td{height:26px;padding:0;border:0;border-radius:3px;background:var(--sunken);text-align:center;font:500 .75rem/26px var(--mono);color:var(--muted)}
.heat td.part{background:var(--seq-part);color:var(--seq-part-ink)}
.heat td.met{background:var(--seq-full);color:var(--seq-full-ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8125rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;background:var(--sunken)}
.legend i.part{background:var(--seq-part)} .legend i.met{background:var(--seq-full)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:400 11px var(--mono)}
.chart text.end{fill:var(--ink);font-weight:500}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ln{fill:none;stroke:var(--focus);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--focus);opacity:.1}
.chart .mk{fill:var(--focus);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1;opacity:0}
.chart .pt:hover .xh,.chart .pt:focus .xh{opacity:1}
.chart .hit{fill:transparent}
.chart .pt{outline:none}
.spark path{fill:none;stroke:var(--focus);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--focus)}
.panel{background:var(--surface);border-radius:8px;padding:12px;display:grid;gap:10px;min-width:0}
.logrow{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 12px;background:var(--surface);text-align:left;min-height:48px}
.logrow:first-child{border-radius:8px 8px 0 0}.logrow:last-child{border-radius:0 0 8px 8px}

/* Plan */
.phases{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.phase{background:var(--surface);border-radius:8px;padding:12px;display:grid;gap:4px;align-content:start}
.rules{display:grid;gap:18px}
.rules ul{padding-left:1.1em;display:grid;gap:5px;max-width:65ch}
.layout td{white-space:normal;min-width:72px}
.stack{display:flex;flex-wrap:wrap;gap:4px 8px}
.stack span{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}

/* Sheet and tooltip */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:grid;align-items:end;justify-items:center}
.sheet-in{background:var(--ground);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:12px 12px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.mvlist{display:grid;gap:4px}
.mv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;width:100%;min-height:50px;padding:8px 10px;border-radius:6px;background:var(--surface);text-align:left}
.mv[disabled]{opacity:.55;cursor:default}
.mv em{display:block;font-style:normal;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pick .chip{width:100%;min-height:48px;background:var(--surface);box-shadow:none}
#sparks{position:fixed;inset:0;width:100vw;height:100vh;z-index:40;pointer-events:none}
#cheer{position:fixed;left:50%;top:32%;z-index:41;width:max-content;max-width:min(86vw,420px);padding:14px 20px;border-radius:10px;background:var(--action);color:var(--action-ink);font:800 1.5rem/1.15 var(--display);text-align:center;text-wrap:balance;transform:translateX(-50%);pointer-events:none}
#cheer.mini{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));padding:8px 16px;font-size:1.0625rem}
#cheer.pop{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}
#tip{position:fixed;z-index:30;max-width:240px;padding:6px 9px;border-radius:6px;background:var(--tip);color:var(--tip-ink);font-size:.8125rem;pointer-events:none}
#tip b{display:block;font:500 .9375rem/1.25 var(--mono)}
/* On a phone the tabs sit under the thumb, and a session gets the whole screen. */
@media (max-width:640px){
  .top{position:static;border-bottom:0}
  .brand{padding-block:10px 0}
  .brand b{font-size:.9375rem;color:var(--muted)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;gap:2px;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
  .tab{flex:1 1 0;min-height:44px}
  .tab[aria-current="page"]{background:var(--sunken);color:var(--ink)}
  main{padding-block:10px 96px;gap:22px}
  body.editing .tabs,body.editing .top{display:none}
  body.editing main{padding-block:8px 0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

ou train with."},{"id":"ease","name":"Butterfly ease","unit":"out of 10","sides":false,"better":"higher","change":2,"how":"How easy is it to sit in butterfly with your knees relaxed? 0 means you can't do it, 10 means it is completely easy."}],"limit":{"name":"What stopped your knee going lower?","options":[{"id":"stretch","label":"Stretch in the inner thigh or groin","short":"Inner thigh","level":"good","text":"An inner-thigh stretch points to muscle and soft tissue, which is what this plan can change."},{"id":"side","label":"Side or back of the hip","short":"Side or back of hip","level":"warning","text":"Feeling it at the side or back of the hip can be the hip's own rotators or the joint. Keep it gentle and mention it to your physio."},{"id":"pinch","label":"Pinch or hard stop at the front of the hip","short":"Pinch at front","level":"critical","text":"A pinch or hard stop at the front often means bone or joint, not a tight muscle. Don't push through it. Show your physio before going further."},{"id":"knee","label":"Pain in the knee","short":"Knee","level":"critical","text":"Knee pain means your knee may be taking twist your hip can't. Stop pressing into this position and tell your physio."},{"id":"none","label":"Nothing, it just stopped","short":"Nothing felt"}]},"rotation_note":{"below":11,"text":"Your outward rotation is not much more than your inward rotation. That pattern can come from the shape of the thigh bone, which no stretching changes, and it may limit how low your knees can go. It is a hint, not a diagnosis, so ask your physio to check."},"side_note":"Don't read much into a small gap between your left and right sides. Differences under about 4 cm can be measuring error.","key":[["✓","A real improvement"],["~","Too small to tell from measuring error"],["!","A real step back. Think about what changed"]],"why":["Butterfly knee height is your actual goal, measured directly. Research has no validated seated version, so this one is adapted from the lying test below.","The lying knee drop is the bent-knee fall-out, a test physios and sports teams use. It is the closest validated measure of your goal, and scores changed straight after surgery released the adductor longus, a main inner-thigh muscle.","Rotation shows whether your hip has the outward turn the position needs, and the gap between outward and inward can hint at bone shape.","What stopped you is the most useful answer here. A stretch can be trained. A pinch or hard stop usually can't, and shouldn't be pushed.","The Copenhagen hold tracks strength, because you want hips that are strong as well as mobile. It is a training marker, not a clinical test.","Published error margins come from trained testers, so home measurements will be less exact. That's why a change only counts past 2 cm or 9 degrees."]},"rules":{"flexible":{"title":"Flexible by design","items":["Targets are for the week, not the day. Open any session and tap Move to put it on another day.","Low on energy? Switch any session to Low energy. It is shorter and easier, and it still counts toward the week.","The weekly layouts are suggestions. Stacked sessions can be split across the morning and evening.","Missed a session? Let it go. Never double up later in the week to make up for it.","When a week falls apart, keep the rest day first, then one physio session, then one mobility session. Climb and skate if you feel like it.","Need more time? Repeat a week. Holidays, illness or a rough patch just move the calendar along."]},"rest":{"title":"Rest days","items":["Every week has at least one full rest day, and easy weeks have two.","A full rest day means no climbing, skating, mobility or physio. Slow walks, sleep and good food are fine.","Want a second rest day in a normal week? Take it. Use the Two rest days layout, which drops Mobility C.","Too tired even for the low energy version? Swap the session for rest, any time. That is the plan working."]},"spacing":{"title":"Spacing","items":["Leave at least a day between the two physio sessions.","Wrist and finger work goes after climbing or on a non-climbing day, never just before climbing.","Long hip holds go after sport or on their own. Short squat drills make a fine warm-up.","Don't climb hard and skate hard on the same day.","After a hard fall on a wrist or hip, leave that area alone until it has settled, and check with your physio."]},"progress":{"title":"When to go up","items":["The plan suggests how hard each phase should be. Your body decides whether you take it.","Felt easy two sessions in a row, with pain at 3 or under? Move to the next phase's version, even early.","Felt hard two sessions in a row? Stay where you are or go back a phase, even if the plan says to move on.","You have two 6 kg dumbbells, so 12 kg with both is the top. Past that, harder means slower: longer lowering, longer pauses, or 2 more reps.","Low energy sessions don't count toward moving on, so an easy day never pushes you up a phase.","Range comes before load. Only add weight where you control the whole movement."]}},"pain_guide":[{"max":3,"level":"good","label":"Carry on","text":"0 to 3 is fine. Keep going."},{"max":5,"level":"warning","label":"Hold","text":"4 or 5: stay at this load, shorten the range and make a note of it."},{"max":10,"level":"critical","label":"Stop","text":"6 or more: stop that exercise and drop back a step next time. Tell your physio if it is sharp, numb, swollen or worse the next morning."}],"praise":{"goal":["Both knees down! Heck yeah, you did it!","Knees on the floor! Hey ho, you did it!"],"finished":["Good job!","Great work!","Heck yeah, you kill it!","Hey ho, let's go! You did great!","That's how it's done!","Look at you go!","Way to show up!","Strong hips incoming!"],"exercise":["Nice!","Good job!","Great work!","Yes!","Strong!","Love it!","Keep going!","Hey ho!"],"rest":["Rest day done. Good job!","Great work resting!","Heck yeah, rest counts too!","Hey ho, recharged and ready!"]},"how_to_use":["Open this page every day. Today shows what to do, and you can tap any day in the strip to see its plan.","For mobility and physio, tap Start. Do each exercise, then tap how it felt. That records it and opens the next one.","For climbing and skating, do your session, then tap Record and add the time and effort.","On a rest day, tap Record rest day. It counts.","Low on energy? Open a session and tap Low energy for a shorter, easier version. It still counts.","Need a different day? Open a session, tap Move, and pick another day this week.","Everything saves by itself on this device. The Progress tab shows it adding up."],"physio_note":"Your physio's advice beats anything on this page. The progressions here are general and were written without knowing why each physio exercise was prescribed, so show them to your physio before weeks 5 and 9, when the exercises get harder."};
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CATS = [['climb','Climb'],['skate','Skate'],['mobility','Mobility'],['physio','Physio'],['rest','Rest']];
const MS = 86400000;
const $ = (s, r=document) => r.querySelector(s);
const view = $('#view');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2,'0');
const toNum = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };

/* ---------- dates: whole days since the epoch, so time zones can't shift a week ---------- */
const toDay = iso => { const [y,m,d] = iso.split('-').map(Number); return Date.UTC(y,m-1,d) / MS; };
const fromDay = n => new Date(n*MS).toISOString().slice(0,10);
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const fmt = (iso, o) => new Date(toDay(iso)*MS).toLocaleDateString(undefined, Object.assign({timeZone:'UTC'}, o));
const shortDate = iso => fmt(iso, {day:'numeric', month:'short'});
const dayName = iso => DAYS[(new Date(toDay(iso)*MS).getUTCDay()+6)%7];

/* ---------- state ---------- */
const S = {
  noStorage:false, lastBackup:null, restore:null,
  settings:{startDate:PLAN.start_date, repeats:{}, layouts:{}, moves:{}},
  logs:[], checks:[], seq:[],
  tab:'today', day:null, edit:null, picker:null, move:null, check:null,
  filter:'all', openEx:null, stale:false,
};

/* The calendar is the 13 plan weeks with any repeated weeks inserted, so a repeat
   moves everything after it along without touching what was already logged. */
function buildSeq(){
  const out = [];
  PLAN.weeks.forEach(w => {
    const n = 1 + ((S.settings.repeats||{})[w.week] || 0);
    for (let r = 0; r < n; r++) out.push(Object.assign({}, w, {repeat:r}));
  });
  S.seq = out;
}
const weekIndex = iso => Math.floor((toDay(iso) - toDay(S.settings.startDate)) / 7);
const curIndex = () => Math.min(S.seq.length-1, Math.max(0, weekIndex(todayISO())));
function defaultDay(){
  const t = todayISO(), first = S.settings.startDate, last = fromDay(toDay(first)+S.seq.length*7-1);
  return t < first ? first : t > last ? last : t;
}
const selDay = () => S.day ?? defaultDay();
const viewIndex = () => Math.min(S.seq.length-1, Math.max(0, weekIndex(selDay())));
const weekStart = i => fromDay(toDay(S.settings.startDate) + i*7);
const phaseKey = i => S.seq[i].phase === 'review' ? 'p3' : S.seq[i].phase;
const cueKey = i => S.seq[i].type === 'easy' ? 'easy' : S.seq[i].phase;
function layoutKey(i){
  if (S.seq[i].type === 'easy') return 'easy';
  return (S.settings.layouts||{})[i] === 'two_rest' ? 'two_rest' : 'standard';
}
function targetsFor(i){
  const w = S.seq[i];
  if (w.type === 'easy') return PLAN.targets.easy;
  return layoutKey(i) === 'two_rest' ? PLAN.targets.two_rest : PLAN.targets[w.type];
}
function exercisesIn(key, i){
  return (PLAN.sessions[key].exercises || []).filter(s => !s.phases || s.phases.includes(phaseKey(i))).map(s => s.id);
}

/* ---------- prescriptions ---------- */
function rxFor(id, i, low){
  const ex = PLAN.exercises[id], w = S.seq[i];
  if (low){
    const r = Object.assign({}, ex.rx.p1);
    r.sets = Math.max(1, r.sets - 1);
    if (r.kg === 12) r.kg = 6;
    return r;
  }
  if (w.type === 'build') return Object.assign({}, ex.rx[w.phase]);
  const back = w.type === 'easy' ? ({p2:'p1', p3:'p2'}[w.phase] || w.phase) : phaseKey(i);
  const r = Object.assign({}, ex.rx[back]);
  r.sets = Math.min(r.sets, Math.max(2, r.sets - 1));
  return r;
}
const repsText = (r, ex) => r.reps.join('–') + (ex.unit === 's' ? ' s' : '');
function rxText(r, ex){
  const parts = [r.sets+' × '+repsText(r, ex)+(ex.per ? ' '+ex.per : '')];
  if (r.kg != null) parts.push(r.kg === 12 ? '12 kg (both dumbbells)' : r.kg+' kg');
  if (r.band) parts.push(r.band.toLowerCase().includes('band') ? r.band : r.band+' band');
  return parts.join(' · ') + (r.add ? ' · '+r.add : '');
}
const defaultLoad = r => r.kg ?? r.band ?? '';

/* ---------- reading the log ---------- */
function isDone(log){
  const cat = PLAN.sessions[log.session] && PLAN.sessions[log.session].category;
  if (cat === 'mobility' || cat === 'physio') return Object.values(log.ex||{}).some(e => e.done);
  return !!cat;
}
const logsInWeek = i => S.logs.filter(l => weekIndex(l.date) === i && isDone(l));
function countsFor(i){
  const c = {climb:0, skate:0, mobility:0, physio:0, rest:0};
  logsInWeek(i).forEach(l => { c[PLAN.sessions[l.session].category]++; });
  return c;
}
/* Lifts save one row per set; holds and bodyweight moves save sets and reps. Both read as rows here. */
function rowsOf(e){
  if (Array.isArray(e.rows)) return e.rows;
  return Array.from({length:toNum(e.sets) || 1}, () => ({load:e.load ?? null, reps:e.reps ?? null}));
}
function rowsText(rows, ex){
  const unit = ex.unit === 's' ? ' s' : '', groups = [];
  rows.forEach(r => {
    const load = r.load ?? '', last = groups[groups.length-1];
    if (last && last.load === load) last.reps.push(r.reps ?? '?'); else groups.push({load, reps:[r.reps ?? '?']});
  });
  return groups.map(g => {
    const same = g.reps.length > 1 && g.reps.every(x => x === g.reps[0]);
    const reps = (same ? g.reps.length+' × '+g.reps[0] : g.reps.join(', '))+unit;
    if (g.load === '') return reps;
    const load = toNum(g.load) != null ? g.load+' kg' : String(g.load).toLowerCase().includes('band') ? g.load : g.load+' band';
    return load+(same ? ': ' : ' × ')+reps;
  }).join(' · ');
}
function history(id){
  return S.logs.filter(l => l.ex && l.ex[id] && l.ex[id].done)
    .map(l => Object.assign({date:l.date, session:l.session, pain:l.pain, low:!!l.low}, l.ex[id], {rows:rowsOf(l.ex[id])}))
    .sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
function stepStatus(id){
  const h = history(id).filter(x => !x.low).slice(-2);
  if (h.length < 2) return null;
  if (h.every(x => x.feel === 'easy' && (x.pain == null || x.pain <= 3))) return 'up';
  if (h.every(x => x.feel === 'hard')) return 'down';
  return null;
}
const STEP_TEXT = {
  up: ['good', 'Felt easy twice. Try the next phase’s version.'],
  down: ['warning', 'Felt hard twice. Stay here or go back a phase.'],
};
/* What the chart for an exercise plots: load if it has one, otherwise hold time or total reps. */
function metricOf(id){
  const ex = PLAN.exercises[id], h = history(id);
  if (ex.load_type === 'kg' && (ex.baseline?.kg != null || h.some(x => x.rows.some(r => toNum(r.load) != null)))) return {key:'kg', label:'Heaviest set', unit:'kg'};
  if (ex.unit === 's') return {key:'s', label:'Hold', unit:'s'};
  return {key:'total', label:'Total reps', unit:'reps'};
}
function metricValue(x, m){
  const nums = x.rows.map(r => toNum(m.key === 'kg' ? r.load : r.reps)).filter(v => v != null);
  if (!nums.length) return null;
  return m.key === 'total' ? nums.reduce((a,b) => a+b, 0) : Math.max(...nums);
}
function seriesFor(id){
  const m = metricOf(id), ex = PLAN.exercises[id], pts = [];
  history(id).filter(x => !x.low).forEach(x => { const y = metricValue(x, m); if (y != null) pts.push({x:x.date, y}); });
  let base = null;
  if (m.key === 'kg' && ex.baseline?.kg != null) base = ex.baseline.kg;
  if (m.key === 's' && ex.baseline?.reps != null) base = ex.baseline.reps;
  return {m, pts, base};
}
/* The most recent time she did this before the given date, in plain words. */
function lastText(id, date){
  const past = history(id).filter(x => x.date < date), x = past[past.length-1];
  if (!x) return null;
  const gap = weekIndex(date) - weekIndex(x.date), ex = PLAN.exercises[id];
  const when = gap === 0 ? 'Earlier this week' : gap === 1 ? 'Last week' : 'Last time';
  return when+' ('+fmt(x.date,{weekday:'short',day:'numeric',month:'short'})+'): '+rowsText(x.rows, ex)+(x.feel ? ', felt '+x.feel : '')+(x.low ? ', low energy' : '');
}
function baselineText(ex){
  const b = ex.baseline; if (!b) return null;
  if (b.kg != null) return b.kg+' kg';
  if (b.band) return b.band+' band';
  if (b.reps != null) return b.sets+' × '+b.reps+(ex.unit === 's' ? ' s' : '');
  return null;
}

/* ---------- saving: everything lives in this browser, under one key ---------- */
const KEY = 'mobile-strong-hips-v1';
const byDateDesc = (a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
function setStatus(text, bad){ const el = $('#status'); el.textContent = text; el.className = 'status'+(bad ? ' bad' : ''); }
function persist(){
  try {
    localStorage.setItem(KEY, JSON.stringify({version:1, settings:S.settings, logs:S.logs, checks:S.checks, lastBackup:S.lastBackup}));
    S.noStorage = false; setStatus('Saved');
  } catch (_){ S.noStorage = true; setStatus('Not saved', true); }
}
function applyData(d){
  S.settings = Object.assign({startDate:PLAN.start_date, repeats:{}, layouts:{}, moves:{}}, d.settings);
  /* The plan first shipped starting 9 Nov. Anything saved under that default follows the move. */
  if (S.settings.startDate === '2026-11-09') S.settings.startDate = PLAN.start_date;
  S.logs = (d.logs || []).slice().sort(byDateDesc);
  S.checks = (d.checks || []).slice().sort((a,b) => byDateDesc(b,a));
  S.lastBackup = d.lastBackup || null;
  buildSeq();
}
function loadSaved(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) applyData(JSON.parse(raw));
    setStatus(raw ? 'Saved' : 'Nothing logged yet');
  } catch (_){ S.noStorage = true; setStatus('Not saved', true); }
}
function saveLog(){
  const doc = clone(S.edit.doc); doc.id = S.edit.id;
  const at = S.logs.findIndex(l => l.id === doc.id);
  if (at < 0) S.logs.push(doc); else S.logs[at] = doc;
  S.logs.sort(byDateDesc);
  persist();
}
function saveSettings(){ buildSeq(); persist(); render(); }

/* The log exists only in this browser, so a backup file is the one way to protect it or move it. */
function downloadBackup(){
  const body = JSON.stringify({app:'mobile-strong-hips', version:1, exported:new Date().toISOString(), settings:S.settings, logs:S.logs, checks:S.checks}, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], {type:'application/json'}));
  a.download = 'mobile-strong-hips-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  S.lastBackup = todayISO(); persist(); render();
}
function readBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== 'mobile-strong-hips' || !Array.isArray(d.logs) || !Array.isArray(d.checks)) throw new Error('wrong file');
      S.restore = {data:d, error:null};
    } catch (_){ S.restore = {data:null, error:'That file is not a Mobile Strong Hips backup.'}; }
    render();
  };
  r.readAsText(file);
}
const backupDue = () => S.logs.length > 0 && (!S.lastBackup || toDay(todayISO()) - toDay(S.lastBackup) >= 14);

/* ---------- charts ---------- */
function niceTicks(lo, hi){
  if (lo === hi){ lo -= 1; hi += 1; }
  const raw = (hi-lo)/3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= raw);
  const out = [];
  for (let v = Math.floor(lo/step)*step; v < hi + step*0.999; v += step) out.push(Math.round(v*100)/100);
  return out;
}
const chartWidth = () => Math.max(260, Math.min(700, view.clientWidth - 56));
function lineChart(pts, o){
  const W = chartWidth(), H = o.h || 170, m = {t:12, r:46, b:22, l:34};
  const xs = pts.map(p => toDay(p.x)); let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1){ x0 -= 3; x1 += 3; }
  const ys = pts.map(p => p.y).concat(o.base != null ? [o.base] : []);
  const ticks = niceTicks(o.yMin ?? Math.min(...ys), o.yMax ?? Math.max(...ys));
  const lo = ticks[0], hi = ticks[ticks.length-1];
  const X = d => m.l + (d-x0)/(x1-x0)*(W-m.l-m.r);
  const Y = v => m.t + (1-(v-lo)/(hi-lo))*(H-m.t-m.b);
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(o.title)+'">';
  ticks.forEach(t => { s += '<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text x="'+(m.l-6)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+t+'</text>'; });
  const first = pts[0], last = pts[pts.length-1];
  s += '<text x="'+m.l+'" y="'+(H-5)+'">'+esc(shortDate(first.x))+'</text>';
  if (pts.length > 1) s += '<text x="'+(W-m.r)+'" y="'+(H-5)+'" text-anchor="end">'+esc(shortDate(last.x))+'</text>';
  const line = pts.map((p,i) => (i?'L':'M')+X(toDay(p.x))+' '+Y(p.y)).join('');
  if (pts.length > 1){
    s += '<path class="ar" d="'+line+'L'+X(toDay(last.x))+' '+Y(lo)+'L'+X(toDay(first.x))+' '+Y(lo)+'Z"/><path class="ln" d="'+line+'"/>';
  }
  pts.forEach((p,i) => {
    const px = X(toDay(p.x)), prev = i ? X(toDay(pts[i-1].x)) : m.l, next = i < pts.length-1 ? X(toDay(pts[i+1].x)) : W-m.r;
    const a = i ? (px+prev)/2 : m.l, b = i < pts.length-1 ? (px+next)/2 : W-m.r;

const SIDES = [['l','Left'],['r','Right']];

const checkRows = () => PLAN.hip_checks.measures.flatMap(m => m.sides

/* A change only counts once it is bigger than the test's measuring error. */
function changeText(m, vals){
  const known = vals.filter(v => v != null);
  if (known.length < 2) return '–';
  const diff = Math.round((known[known.length-1]-known[0])*10)/10, text = (diff > 0 ? '+' : '')+diff;
  if (!m.change) return text;
  if (Math.abs(diff) < m.change) return text+' ~';
  return text+((m.better === 'lower' ? diff < 0 : diff > 0) ? ' ✓' : ' !');
}
function goalTiles(){
  const C = S.checks, last = C[C.length-1], first = C[0];
  if (!last) return '';
  return '<div class="tiles two">'+SIDES.map(([k,label]) => {
    const now = toNum((last.values||{})['butterfly_'+k]), was = toNum((first.values||{})['butterfly_'+k]);
    return '<div class="tile"><span class="val num">'+(now === 0 ? 'Down ✓' : now == null ? '–' : now+'<span class="small muted"> cm</span>')+'</span><span class="lab">'+label+' knee to the floor'+(was != null && C.length > 1 ? ', from '+was+' cm' : '')+'</span></div>';
  }).join('')+'</div>';
}
function checkInsights(){
  const H = PLAN.hip_checks, last = S.checks[S.checks.length-1];
  if (!last) return '';
  const v = last.values || {}, flags = [];
  H.limit.options.filter(o => o.text).forEach(o => {
    const sides = SIDES.filter(([k]) => v['limit_'+k] === o.id).map(([,l]) => l);
    if (sides.length) flags.push([o.level, (sides.length === 2 ? 'Both sides' : sides[0]+' side')+': '+o.text]);
  });
  const tight = SIDES.filter(([k]) => { const er = toNum(v['er_'+k]), ir = toNum(v['ir_'+k]); return er != null && ir != null && er-ir < H.rotation_note.below; }).map(([,l]) => l);
  if (tight.length) flags.push(['warning', (tight.length === 2 ? 'Both sides' : tight[0]+' side')+': '+H.rotation_note.text]);
  return flags.map(([level,text]) => '<p class="flag" data-level="'+level+'">'+esc(text)+'</p>').join('');
}

  switch (act){
    case 'prev': S.day = fromDay(toDay(selDay())-7); render(); break;
    case 'next': S.day = fromDay(toDay(selDay())+7); render(); break;
    case 'goto': S.day = +d.i === weekIndex(defaultDay()) ? null : weekStart(+d.i); render(); break;
    case 'day': S.day = d.date; S.tab = 'today'; render(); window.scrollTo(0,0); break;
    case 'back-today': S.day = null; render(); window.scrollTo(0,0); break;
    case 'layout': {
      const i = viewIndex(); S.settings.layouts = S.settings.layouts || {};
      if (S.settings.layouts[i] === 'two_rest') delete S.settings.layouts[i]; else S.settings.layouts[i] = 'two_rest';
      saveSettings(); break;
    }
    case 'repeat': {
      const w = S.seq[viewIndex()].week; S.settings.repeats = S.settings.repeats || {};
      S.settings.repeats[w] = (S.settings.repeats[w] || 0) + 1; saveSettings(); break;
    }
    case 'unrepeat': {
      const w = S.seq[viewIndex()].week;
      if (S.settings.repeats[w] > 1) S.settings.repeats[w]--; else delete S.settings.repeats[w];
      saveSettings(); break;
    }
    case 'log': openEditor(d.date, d.key); break;
    case 'picker': S.picker = d.date; paintSheet(); break;
    case 'sheet-close': if (e.target === el || el.tagName === 'BUTTON'){ S.picker = null; S.move = null; paintSheet(); } break;
    case 'low-edit':
      S.edit.doc.low = d.v === '1'; S.edit.open = undefined;
      if (S.logs.some(l => l.id === S.edit.id)) saveLog();
      view.innerHTML = editorView(); break;
    case 'ex-open': S.edit.open = S.edit.open === d.ex ? null : d.ex; paintExs(true); break;
    case 'tick': {
      const cur = exState(d.ex), box = el.getBoundingClientRect();
      if (cur.done){ delete cur.done; delete cur.feel; }
      else { markDone(d.ex); burst(box.left+box.width/2, box.top+box.height/2, 12); miniCheer(pick(PLAN.praise.exercise)); }
      saveLog(); refreshCard(d.ex); break;
    }
    case 'tick-all': {
      const {doc} = S.edit, list = listFor(doc.session, editIndex(), doc.low);
      needed(doc.session, list).filter(id => unfinished(doc, id)).forEach(markDone);
      S.edit.open = null; saveLog(); paintExs(false);
      const box = el.getBoundingClientRect(); burst(box.left+box.width/2, box.top, 20); miniCheer(pick(PLAN.praise.exercise));
      break;
    }
    case 'move': S.move = {planned:d.planned, key:d.key, cur:d.cur, i:+d.i}; paintSheet(); break;
    case 'move-to': {
      const moves = S.settings.moves = S.settings.moves || {}, id = S.move.planned+'|'+S.move.key;
      if (d.date === S.move.planned) delete moves[id]; else moves[id] = d.date;
      S.day = d.date === defaultDay() ? null : d.date;
      S.move = null; S.edit = null; paintSheet(); saveSettings(); window.scrollTo(0,0); break;
    }
    case 'back': closeEditor(); break;
    case 'feel': {
      const id = d.ex, doc = S.edit.doc, idx = Math.min(S.seq.length-1, Math.max(0, weekIndex(doc.date)));
      const r = rxFor(id, idx, doc.low), cur = exState(id), first = !cur.done, box = el.getBoundingClientRect();
      doc.ex[id] = hasLoad(PLAN.exercises[id], r)
        ? {done:true, feel:d.feel, rows:carried(cur.rows || blankRows(r.sets), r)}
        : {done:true, feel:d.feel, sets:cur.sets ?? r.sets, reps:cur.reps ?? r.reps[0]};
      S.edit.open = null; saveLog(); paintExs(false);
      if (first){ burst(box.left+box.width/2, box.top, 14); miniCheer(pick(PLAN.praise.exercise)); }
      break;
    }
    case 'set-add': {
      const id = d.ex, doc = S.edit.doc, idx = Math.min(S.seq.length-1, Math.max(0, weekIndex(doc.date)));
      const cur = exState(id), r = rxFor(id, idx, doc.low);
      cur.rows = cur.rows || blankRows(r.sets);
      cur.rows.push(cur.done ? Object.assign({}, cur.rows[cur.rows.length-1]) : {});
      saveLog(); refreshCard(id); break;
    }
    case 'set-del': {
      const id = d.ex, doc = S.edit.doc, idx = Math.min(S.seq.length-1, Math.max(0, weekIndex(doc.date)));
      const cur = exState(id), r = rxFor(id, idx, doc.low);
      cur.rows = cur.rows || blankRows(r.sets);
      cur.rows.splice(+d.row, 1);
      saveLog(); refreshCard(id); break;
    }
    case 'skip': {
      const on = !S.edit.doc.ex[d.ex]?.skipped;
      S.edit.doc.ex[d.ex] = on ? {skipped:true} : {};
      saveLog();
      S.edit.open = null; paintExs(false);
      break;
    }
    case 'effort': case 'pain': {
      const v = +d.v, cur = S.edit.doc[act];
      S.edit.doc[act] = cur === v ? null : v;
      el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === S.edit.doc[act])));
      if (act === 'pain'){ $('#painflag').innerHTML = painFlag(S.edit.doc.pain); $('#f-wherewrap').hidden = !(S.edit.doc.pain > 0); }
      saveLog(); break;
    }
    case 'finish': {
      const doc = S.edit.doc, first = !doc.finishedAt;
      doc.finishedAt = doc.finishedAt || new Date().toISOString();
      saveLog(); closeEditor();
      if (first && isDone(doc)) celebrate(doc.session === 'rest' ? PLAN.praise.rest : PLAN.praise.finished);
      break;
    }
    case 'delete':
      if (!S.edit.armed){ S.edit.armed = true; el.textContent = 'Tap again to delete'; break; }
      S.logs = S.logs.filter(l => l.id !== S.edit.id); persist();
      closeEditor(); break;
    case 'filter': S.filter = d.v; S.openEx = null; render(); break;
    case 'open-ex': S.openEx = S.openEx === d.id ? null : d.id; render(); break;
    case 'check-new': {
      const t = todayISO(), have = S.checks.find(c => c.date === t);
      const before = S.checks[S.checks.length-1];
      S.check = have ? {date:t, orig:t, values:clone(have.values||{}), exists:true} : {date:t, values:before && before.values && before.values.heel_gap ? {heel_gap:before.values.heel_gap} : {}};
      S.tab = 'progress'; render(); break;
    }
    case 'check-edit': { const c = S.checks.find(x => x.id === d.id); S.check = {date:c.date, orig:c.date, values:clone(c.values||{}), exists:true}; render(); break; }
    case 'check-cancel': S.check = null; render(); break;
    case 'check-save': {
      const c = S.check;
      S.checks = S.checks.filter(x => x.date !== c.date && x.date !== c.orig);
      S.checks.push({id:c.date, date:c.date, values:c.values});
      S.checks.sort((a,b) => byDateDesc(b,a));
      const down = toNum(c.values.butterfly_l) === 0 && toNum(c.values.butterfly_r) === 0;
      S.check = null; persist(); render(); celebrate(down ? PLAN.praise.goal : PLAN.praise.finished); break;
    }
    case 'check-delete':
      if (!S.check.armed){ S.check.armed = true; el.textContent = 'Tap again to delete'; break; }
      S.checks = S.checks.filter(x => x.date !== S.check.orig);
      S.check = null; persist(); render(); break;
    case 'backup': downloadBackup(); break;
    case 'restore-yes': applyData(Object.assign({lastBackup:todayISO()}, S.restore.data)); S.restore = null; S.day = null; persist(); render(); break;
    case 'restore-no': S.restore = null; render(); break;
    case 'set-start': {
      const v = $('#start-date').value;
      if (v){ S.settings.startDate = v; S.day = null; saveSettings(); }
      break;
    }
  }
}
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){ setTab(tab.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (el) onAct(el.dataset.act, el, e);
});
view.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.checkM){ S.check.values[d.checkM] = el.value.trim(); return; }
  if (d.check === 'date'){ S.check.date = el.value; return; }
  if (!S.edit) return;
  if (d.ex){
    const raw = el.value.trim(), cur = exState(d.ex), value = toNum(raw) ?? raw;
    if (d.row != null){
      const doc = S.edit.doc, r = rxFor(d.ex, Math.min(S.seq.length-1, Math.max(0, weekIndex(doc.date))), doc.low);
      cur.rows = cur.rows || blankRows(r.sets);
      const row = cur.rows[+d.row];
      if (raw === '') delete row[d.f]; else row[d.f] = value;
      carried(cur.rows, r).forEach((x, k) => ['load','reps'].forEach(f => { const box = $('#in-'+d.ex+'-'+k+'-'+f); if (box) box.placeholder = x[f] ?? ''; }));
    } else if (raw === '') delete cur[d.f]; else cur[d.f] = value;
    saveLog(); return;
  }
  if (d.field){
    if (d.field === 'date'){ if (el.value) S.edit.doc.date = el.value; }
    else if (d.field === 'minutes') S.edit.doc.minutes = toNum(el.value);
    else S.edit.doc[d.field] = el.value;
    saveLog();
  }
});
view.addEventListener('change', e => { if (e.target.id === 'restore-file' && e.target.files[0]) readBackup(e.target.files[0]); });
view.addEventListener('focusout', () => { if (S.stale){ S.stale = false; setTimeout(safeRender, 0); } });

/* ---------- praise and fireworks ---------- */
let lastPraise = null, cheerT = null, sparks = [], sparkRaf = 0, sparkT = 0;
function pick(list){
  const options = list.filter(x => x !== lastPraise);
  return lastPraise = options[Math.floor(Math.random()*options.length)];
}
function drawSparks(now){
  /* step by elapsed time, so a 120 Hz phone doesn't run them at double speed */
  const step = sparkT ? Math.min(3, (now-sparkT)/16.7) : 1; sparkT = now;
  const c = $('#sparks'), g = c.getContext('2d'), ratio = devicePixelRatio || 1;
  g.setTransform(ratio, 0, 0, ratio, 0, 0);
  g.clearRect(0, 0, innerWidth, innerHeight);
  sparks = sparks.filter(p => p.life > 0);
  sparks.forEach(p => {
    p.x += p.vx*step; p.y += p.vy*step; p.vy += .06*step; p.life -= .018*step;
    g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.color;
    g.beginPath(); g.arc(p.x, p.y, p.size, 0, 7); g.fill();
  });
  if (sparks.length) sparkRaf = requestAnimationFrame(drawSparks);
  else { sparkRaf = 0; sparkT = 0; c.hidden = true; }
}
function burst(x, y, count){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#sparks'), ratio = devicePixelRatio || 1, css = getComputedStyle(document.documentElement);
  const colors = ['--band-yellow','--band-red','--band-green','--climb','--rest'].map(n => css.getPropertyValue(n).trim());
  if (c.hidden){ c.width = innerWidth*ratio; c.height = innerHeight*ratio; c.hidden = false; }
  for (let n = 0; n < count; n++){
    const a = Math.PI*2*n/count + Math.random()*.4, v = 1.4 + Math.random()*2.6;
    sparks.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:.8 + Math.random()*.4, size:1.4 + Math.random()*1.6, color:colors[n % colors.length]});
  }
  if (!sparkRaf) sparkRaf = requestAnimationFrame(drawSparks);
}
function miniCheer(text){
  const el = $('#cheer');
  el.textContent = text; el.hidden = false; el.classList.add('mini');
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  clearTimeout(cheerT); cheerT = setTimeout(() => { el.hidden = true; }, 1100);
}
function celebrate(list){
  const el = $('#cheer');
  el.classList.remove('mini');
  el.textContent = pick(list); el.hidden = false;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  clearTimeout(cheerT); cheerT = setTimeout(() => { el.hidden = true; }, 2600);
  [[.28,.3],[.72,.24],[.5,.42],[.2,.48],[.8,.46]].forEach(([fx,fy], n) => setTimeout(() => burst(innerWidth*fx, innerHeight*fy, 26), n*170));
}

/* one tooltip for every chart point and heat cell */
const tip = $('#tip');
function showTip(el){
  if (!el.dataset.tip) return;
  tip.textContent = '';
  const b = document.createElement('b'); b.textContent = el.dataset.tip; tip.appendChild(b);
  if (el.dataset.sub) tip.appendChild(document.createTextNode(el.dataset.sub));
  tip.hidden = false;
  const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth-t.width-8, r.left+r.width/2-t.width/2))+'px';
  tip.style.top = Math.max(8, r.top-t.height-8)+'px';
}
const hideTip = () => { tip.hidden = true; };
['pointerover','focusin'].forEach(n => view.addEventListener(n, e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); }));
['pointerout','focusout'].forEach(n => view.addEventListener(n, hideTip));

let lastW = 0;
addEventListener('resize', () => { const w = view.clientWidth; if (Math.abs(w-lastW) > 8){ lastW = w; safeRender(); } });

/* ---------- start ---------- */
(function init(){
  const fromHash = location.hash.slice(1);
  if (['today','exercises','progress','plan'].includes(fromHash)) S.tab = fromHash;
  addEventListener('hashchange', () => { const t = location.hash.slice(1); if (['today','exercises','progress','plan'].includes(t)) setTab(t); });
  /* the same page open in a second tab */
  addEventListener('storage', e => { if (e.key === KEY){ loadSaved(); safeRender(); } });
  buildSeq(); loadSaved(); render(); lastW = view.clientWidth;
})();
})();
</script>
